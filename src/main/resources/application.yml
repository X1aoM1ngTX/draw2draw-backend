  #       driver-class-name: com.mysql.cj.jdbc.Driver
  #       url: jdbc:mysql://localhost:3306/d2d
  #       username: root
  #       password: 123456
  #   rules:
  #     sharding:
  #       tables:
  #         picture:
  #           actual-data-nodes: d2d.picture  # 动态分表
  #           table-strategy:
