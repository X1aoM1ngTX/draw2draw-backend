# 主配置文件
spring:
  application:
    name: draw2draw-backend
  profiles:
    # 默认激活开发环境配置
    active: dev
  # 通用配置，所有环境共享
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/d2d
    username: root
    password: 123456
  # Redis 配置
  redis:
    database: 1
    host: localhost
    port: 6379
    timeout: 5000
  # Session 配置
  session:
    store-type: redis
    timeout: 2592000
  # 配置文件上传大小限制
  servlet:
    multipart:
      max-file-size: 10MB
  # 空间图片分表 - 已禁用
  # shardingsphere:
