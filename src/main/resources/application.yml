  #           type: CLASS_BASED
  #           props:
  #             strategy: standard
  #             algorithmClassName: com.xm.draw2drawbackend.manager.sharding.PictureShardingAlgorithm
  #   props:
  #     sql-show: true

server:
  port: 8090
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000

mybatis-plus:
  global-config:
    db-config:
      # 逻辑删除
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    enable-sql-runner: true
  configuration:
    # 开启下划线转驼峰命名
    map-underscore-to-camel-case: false
    # 开启打印 SQL
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  # 指定mapper xml文件的位置
  mapper-locations: classpath*:generator/mapper/*.xml

knife4j:
  enable: true
  openapi:
    title: Draw2Draw接口文档
    version: v1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.xm.draw2drawbackend.controller
